services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skillbridge
      POSTGRES_USER: skillbridge
      POSTGRES_PASSWORD: skillbridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillbridge -d skillbridge"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    environment:
      DATABASE_URL: postgresql://skillbridge:skillbridge@postgres:5432/skillbridge
      PORT: 3001
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
    environment:
      API_URL: http://server:3001
    ports:
      - "5173:3000"
    depends_on:
      - server

volumes:
  postgres_data:
  server_node_modules:
